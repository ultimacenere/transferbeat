<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-RLST76W6H2"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-RLST76W6H2');</script>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Campionati e coppe — TransferBeat</title>
<meta name="description" content="Serie A, Champions League, Premier League, Liga, Bundesliga e Ligue 1: classifiche, calendario, risultati e marcatori aggiornati. La sezione campionati di TransferBeat.">
<link rel="alternate" hreflang="it" href="./campionati.html?lang=it">
<link rel="alternate" hreflang="en" href="./campionati.html?lang=en">
<link rel="alternate" hreflang="es" href="./campionati.html?lang=es">
<link rel="canonical" href="https://transferbeat.com/campionati.html">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fff;--panel:#f7f8fa;--line:#e2e6ea;--txt:#161b21;--muted:#67727e;--accent:#0a9d57;--blue:#1f6fd6;--red:#e0392b}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--txt);line-height:1.5}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
header{border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.brand{font-family:Georgia,serif;font-size:26px;font-weight:700}.brand b{color:var(--accent)}
.brand .wc{font-size:13px;font-weight:800;color:var(--accent);letter-spacing:.5px;margin-left:8px;vertical-align:middle}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{font-size:13px;color:var(--muted);padding:8px 10px;border-bottom:2px solid transparent}
nav.tabs a.here{color:var(--txt);border-bottom-color:var(--accent);font-weight:700}
.langsw a{font-size:11px;font-weight:700;padding:3px 7px;border:1px solid var(--line);border-radius:6px;color:var(--muted);margin-left:4px;cursor:pointer}
.langsw a.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.hero{background:linear-gradient(120deg,#0b4d33,#0a9d57);color:#fff;padding:22px 0}
.hero h1{font-family:Georgia,serif;font-size:30px}
.hero p{opacity:.9;font-size:13.5px;margin-top:4px}
.comps{display:flex;gap:6px;margin:18px 0 6px;flex-wrap:wrap}
.comps button{border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:700;font-size:13px;padding:8px 14px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:6px}
.comps button img{width:18px;height:18px;object-fit:contain}
.comps button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.seg{display:flex;gap:6px;margin:10px 0 18px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:#fff;color:var(--muted);font-weight:700;font-size:13px;padding:7px 12px;border-radius:20px;cursor:pointer}
.seg button.on{background:var(--txt);color:#fff;border-color:var(--txt)}
.upd{font-size:12px;color:var(--muted);margin-bottom:12px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:18px}
.card h2{background:var(--panel);font-size:14px;padding:10px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;text-align:center}
th{font-size:10px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;background:#fcfcfd}
td.team,th.team{text-align:left;padding-left:12px;white-space:nowrap}
tbody tr{border-top:1px solid var(--line)}
tbody tr.z1 td.pos{color:var(--accent);font-weight:800}
tbody tr.z2 td.pos{color:var(--blue);font-weight:800}
tbody tr.z3 td.pos{color:#c9a227;font-weight:800}
tbody tr.zr td.pos{color:var(--red);font-weight:800}
.crest{width:20px;height:20px;object-fit:contain;margin-right:7px;vertical-align:-5px}
.pt{font-weight:800}
.form span{display:inline-block;width:14px;height:14px;line-height:14px;border-radius:3px;font-size:9px;font-weight:800;color:#fff;margin:0 1px}
.form .W{background:var(--accent)}.form .D{background:#9aa4ae}.form .L{background:var(--red)}
.mdnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mdnav button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:3px 9px;cursor:pointer;font-weight:700}
.mdnav button:disabled{opacity:.35;cursor:default}
.fixtures{padding:8px 12px 12px;font-size:13px}
.fx{display:grid;grid-template-columns:70px 1fr auto 1fr;align-items:center;gap:8px;padding:7px 0;border-top:1px solid #eef1f5}
.fx:first-child{border-top:0}
.fx .d{color:var(--muted);font-size:11px}
.fx .h{text-align:right}
.fx .r{font-weight:800;background:var(--panel);padding:2px 9px;border-radius:5px;min-width:52px;text-align:center}
.fx .r.live{background:#fdecea;color:var(--red)}
.fx .vs{color:var(--muted);font-size:11px}
@media(max-width:560px){.fx{grid-template-columns:54px 1fr auto 1fr;font-size:12px}.crest{width:16px;height:16px}}
.legend{font-size:11px;color:var(--muted);padding:6px 12px 10px}
.foot{border-top:3px solid var(--accent);margin-top:26px;padding:18px 0;color:var(--muted);font-size:12px;text-align:center}
.err{background:#fff6f6;border:1px solid #f3c9c9;color:#a33;border-radius:12px;padding:16px;margin:20px 0}
</style>
</head>
<body>
<header><div class="wrap top">
  <div><a class="brand" href="index.html?lang=it">Transfer<b>Beat</b><span class="wc" id="wctag">CAMPIONATI</span></a></div>
  <nav class="tabs" id="nav"></nav>
  <div class="langsw" id="langsw"></div>
</div></header>
<div class="hero"><div class="wrap"><h1 id="heroH">Campionati e coppe</h1><p id="heroP">Classifiche, calendario, risultati e marcatori aggiornati ogni due ore</p></div></div>
<div class="wrap">
  <div class="comps" id="comps"></div>
  <div class="seg" id="seg"></div>
  <div class="upd" id="upd"></div>
  <div id="error"></div>
  <div id="view"></div>
</div>
<div class="foot"><div class="wrap" id="foot"></div></div>
<nav class="tb-sitelinks" aria-label="Sezioni" style="border-top:1px solid #e2e6ea;margin-top:8px;padding:16px 18px;font-size:12px;display:flex;flex-wrap:wrap;gap:8px 16px;justify-content:center"><a href="https://transferbeat.com/" style="color:#67727e">Home</a><a href="https://transferbeat.com/articoli/it/" style="color:#67727e">Articoli</a><a href="https://transferbeat.com/board.html" style="color:#67727e">Live board</a><a href="https://transferbeat.com/campionati.html" style="color:#67727e">Campionati</a><a href="https://transferbeat.com/mondiali.html" style="color:#67727e">Mondiale 2026</a><a href="https://transferbeat.com/fonti.html" style="color:#67727e">Fonti</a><a href="https://transferbeat.com/fanta/" style="color:#67727e">FantaTB</a></nav>

<script>
const STR={
 it:{tag:"CAMPIONATI",heroH:"Campionati e coppe",heroP:"Classifiche, calendario, risultati e marcatori aggiornati ogni due ore",
     home:"Home",live:"Live",art:"Articoli",camp:"Campionati",fanta:"FantaTB",classifica:"Classifica",giornata:"Giornata",marcatori:"Marcatori",
     th:["#","Squadra","PG","V","N","P","GF","GS","DR","Pt","Forma"],thm:["#","Giocatore","Squadra","Gol","Rig.","Assist"],vs:"vs",
     upd:"Aggiornato",noclass:"Classifica non ancora disponibile: la competizione non è iniziata.",nodata:"Nessuna partita in questa giornata.",
     legend:"Verde: zona Champions · Blu: Europa League · Oro: Conference · Rosso: retrocessione",
     stat:{TIMED:"",SCHEDULED:"",IN_PLAY:"LIVE",PAUSED:"INT",FINISHED:"",POSTPONED:"rinviata",SUSPENDED:"sospesa",CANCELLED:"annullata",AWARDED:"a tavolino"},
     foot:"TransferBeat — Campionati e coppe · dati football-data.org"},
 en:{tag:"LEAGUES",heroH:"Leagues and cups",heroP:"Standings, fixtures, results and top scorers, updated every two hours",
     home:"Home",live:"Live",art:"Articles",camp:"Leagues",fanta:"FantaTB",classifica:"Standings",giornata:"Matchday",marcatori:"Top scorers",
     th:["#","Team","P","W","D","L","GF","GA","GD","Pts","Form"],thm:["#","Player","Team","Goals","Pen.","Assists"],vs:"vs",
     upd:"Updated",noclass:"Standings not available yet: the competition has not started.",nodata:"No matches on this matchday.",
     legend:"Green: Champions League · Blue: Europa League · Gold: Conference · Red: relegation",
     stat:{TIMED:"",SCHEDULED:"",IN_PLAY:"LIVE",PAUSED:"HT",FINISHED:"",POSTPONED:"postponed",SUSPENDED:"suspended",CANCELLED:"cancelled",AWARDED:"awarded"},
     foot:"TransferBeat — Leagues and cups · data football-data.org"},
 es:{tag:"LIGAS",heroH:"Ligas y copas",heroP:"Clasificaciones, calendario, resultados y goleadores, actualizados cada dos horas",
     home:"Inicio",live:"En vivo",art:"Artículos",camp:"Ligas",fanta:"FantaTB",classifica:"Clasificación",giornata:"Jornada",marcatori:"Goleadores",
     th:["#","Equipo","PJ","G","E","P","GF","GC","DG","Pts","Racha"],thm:["#","Jugador","Equipo","Goles","Pen.","Asist."],vs:"vs",
     upd:"Actualizado",noclass:"Clasificación aún no disponible: la competición no ha empezado.",nodata:"No hay partidos en esta jornada.",
     legend:"Verde: zona Champions · Azul: Europa League · Oro: Conference · Rojo: descenso",
     stat:{TIMED:"",SCHEDULED:"",IN_PLAY:"EN VIVO",PAUSED:"DESC",FINISHED:"",POSTPONED:"aplazado",SUSPENDED:"suspendido",CANCELLED:"cancelado",AWARDED:"por decisión"},
     foot:"TransferBeat — Ligas y copas · datos football-data.org"}
};
// zone di classifica per competizione: [champions, europa, conference, retrocessione(dal basso)]
const ZONES={SA:[4,1,1,3],PL:[5,1,0,3],PD:[5,1,1,3],BL1:[4,1,1,2],FL1:[3,1,1,2],CL:[8,16,0,12]};
const P=new URLSearchParams(location.search);
let lang=(P.get('lang')||localStorage.getItem('tb_lang')||'it').toLowerCase();
if(!['it','en','es'].includes(lang))lang='it';
localStorage.setItem('tb_lang',lang);document.documentElement.lang=lang;
const T=STR[lang];
let DATA=null,comp=(P.get('c')||'SA').toUpperCase(),mode='classifica',md=null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fdate(utc){try{const d=new Date(utc);const loc=lang==='it'?'it-IT':(lang==='es'?'es-ES':'en-GB');
  return d.toLocaleDateString(loc,{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString(loc,{hour:'2-digit',minute:'2-digit'});}catch(e){return''}}
function tn(t){const c=t.crest?`<img class="crest" src="${esc(t.crest)}" alt="" loading="lazy" onerror="this.style.display='none'">`:'';return c+esc(t.short||t.name);}
function applyStatic(){
  document.getElementById('wctag').textContent=T.tag;
  document.getElementById('heroH').textContent=T.heroH;
  document.getElementById('heroP').textContent=T.heroP;
  document.getElementById('foot').textContent=T.foot;
  document.getElementById('nav').innerHTML=
    `<a href="index.html?lang=${lang}">${T.home}</a><a href="board.html?lang=${lang}">${T.live}</a><a href="articoli/${lang}/">${T.art}</a>`+
    `<a class="here" href="campionati.html?lang=${lang}">${T.camp}</a><a href="fanta/" style="color:var(--accent);font-weight:700">${T.fanta}</a>`;
  const ls=document.getElementById('langsw');
  ls.innerHTML=['it','en','es'].map(l=>`<a class="${l===lang?'on':''}" data-l="${l}">${l.toUpperCase()}</a>`).join('');
  ls.querySelectorAll('a').forEach(a=>a.onclick=()=>{localStorage.setItem('tb_lang',a.dataset.l);location.search='?lang='+a.dataset.l+'&c='+comp;});
}
function cur(){return DATA.competizioni.find(c=>c.code===comp)||DATA.competizioni[0];}
function renderComps(){
  const el=document.getElementById('comps');
  el.innerHTML=DATA.competizioni.map(c=>`<button data-c="${c.code}" class="${c.code===comp?'on':''}">${c.emblem?`<img src="${esc(c.emblem)}" alt="">`:''}${esc(c.nome[lang]||c.nome.it)}</button>`).join('');
  el.querySelectorAll('button').forEach(b=>b.onclick=()=>{comp=b.dataset.c;md=null;history.replaceState(null,'','?lang='+lang+'&c='+comp);renderComps();render();});
  const seg=document.getElementById('seg');
  seg.innerHTML=`<button data-m="classifica">${T.classifica}</button><button data-m="giornata">${T.giornata}</button><button data-m="marcatori">${T.marcatori}</button>`;
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{mode=b.dataset.m;render();});
}
function zoneClass(pos,n,code){const z=ZONES[code]||[0,0,0,0];if(pos<=z[0])return 'z1';if(pos<=z[0]+z[1])return 'z2';if(pos<=z[0]+z[1]+z[2])return 'z3';if(pos>n-z[3])return 'zr';return '';}
function formHtml(f){return '<span class="form">'+(f||'').split(',').filter(Boolean).slice(-5).map(x=>`<span class="${x}">${x}</span>`).join('')+'</span>';}
function renderClassifica(c){
  if(!c.classifica.length)return `<div class="card"><div class="legend">${T.noclass}</div></div>`;
  return c.classifica.map(t=>{const n=t.table.length;
    const rows=t.table.map(r=>`<tr class="${zoneClass(r.pos,n,c.code)}"><td class="pos">${r.pos}</td><td class="team">${tn(r.team)}</td><td>${r.pg}</td><td>${r.v}</td><td>${r.n}</td><td>${r.p}</td><td>${r.gf}</td><td>${r.gs}</td><td>${r.dr>0?'+':''}${r.dr}</td><td class="pt">${r.pt}</td><td>${formHtml(r.form)}</td></tr>`).join('');
    return `<div class="card"><h2>${esc(c.nome[lang]||c.nome.it)}${t.group&&/GROUP|Group|Girone/.test(t.group)?' · '+esc(t.group):''}</h2><div style="overflow-x:auto"><table><thead><tr>${T.th.map((h,i)=>`<th class="${i===1?'team':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div><div class="legend">${T.legend}</div></div>`;
  }).join('');
}
function scoreHtml(m){
  const st=T.stat[m.status]!==undefined?T.stat[m.status]:m.status;
  if(m.ft)return `<span class="r ${m.status==='IN_PLAY'||m.status==='PAUSED'?'live':''}">${m.ft[0]}-${m.ft[1]}${st?' '+st:''}</span>`;
  return `<span class="r vs">${st||T.vs}</span>`;
}
function renderGiornata(c){
  const keys=Object.keys(c.giornate).map(Number).sort((a,b)=>a-b);
  if(!keys.length)return `<div class="card"><div class="legend">${T.nodata}</div></div>`;
  if(md===null||!keys.includes(md))md=keys.includes(c.giornata)?c.giornata:keys[0];
  const i=keys.indexOf(md);
  const ms=c.giornate[String(md)]||[];
  const rows=ms.map(m=>`<div class="fx"><span class="d">${fdate(m.utc)}</span><span class="h">${tn(m.home)}</span>${scoreHtml(m)}<span>${tn(m.away)}</span></div>`).join('')||`<div class="legend">${T.nodata}</div>`;
  return `<div class="card"><h2><span>${esc(c.nome[lang]||c.nome.it)}</span><span class="mdnav"><button id="mdPrev" ${i<=0?'disabled':''}>‹</button><span>${T.giornata} ${md}</span><button id="mdNext" ${i>=keys.length-1?'disabled':''}>›</button></span></h2><div class="fixtures">${rows}</div></div>`+
    Object.keys(c.stages||{}).map(st=>`<div class="card"><h2>${esc(st.replace(/_/g,' ').toLowerCase())}</h2><div class="fixtures">${(c.stages[st]||[]).map(m=>`<div class="fx"><span class="d">${fdate(m.utc)}</span><span class="h">${tn(m.home)}</span>${scoreHtml(m)}<span>${tn(m.away)}</span></div>`).join('')}</div></div>`).join('');
}
function renderMarcatori(c){
  if(!c.marcatori.length)return `<div class="card"><div class="legend">${T.nodata}</div></div>`;
  const rows=c.marcatori.map((s,i)=>`<tr><td class="pos">${i+1}</td><td class="team">${esc(s.name)}</td><td class="team">${tn(s.team)}</td><td class="pt">${s.goals}</td><td>${s.pen||0}</td><td>${s.assists||0}</td></tr>`).join('');
  return `<div class="card"><h2>${T.marcatori} · ${esc(c.nome[lang]||c.nome.it)}</h2><table><thead><tr>${T.thm.map((h,i)=>`<th class="${i===1||i===2?'team':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;
}
function render(){
  const c=cur(); if(!c)return;
  document.getElementById('seg').querySelectorAll('button').forEach(b=>b.className=b.dataset.m===mode?'on':'');
  document.getElementById('upd').textContent=T.upd+' '+fdate(DATA.aggiornato);
  const v=document.getElementById('view');
  v.innerHTML=mode==='classifica'?renderClassifica(c):(mode==='giornata'?renderGiornata(c):renderMarcatori(c));
  const p=document.getElementById('mdPrev'),n=document.getElementById('mdNext');
  if(p)p.onclick=()=>{const k=Object.keys(c.giornate).map(Number).sort((a,b)=>a-b);md=k[k.indexOf(md)-1];render();};
  if(n)n.onclick=()=>{const k=Object.keys(c.giornate).map(Number).sort((a,b)=>a-b);md=k[k.indexOf(md)+1];render();};
}
function init(){
  applyStatic();
  fetch('data/competizioni.json?t='+Math.floor(Date.now()/600000)).then(r=>{if(!r.ok)throw 0;return r.json();}).then(d=>{DATA=d;renderComps();render();})
    .catch(()=>{document.getElementById('error').innerHTML='<div class="err">Dati non caricati. Apri il sito via server (GitHub/Vercel).</div>';});
}
init();
</script>
</body>
</html>
