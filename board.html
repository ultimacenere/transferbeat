<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TransferBeat — Live board</title>
<link rel="alternate" hreflang="it" href="./board.html?lang=it">
<link rel="alternate" hreflang="en" href="./board.html?lang=en">
<link rel="alternate" hreflang="es" href="./board.html?lang=es">
<link rel="alternate" hreflang="x-default" href="./board.html">
<style>
  :root{
    --bg:#ffffff; --panel:#f7f8fa; --panel2:#eef1f5; --line:#e2e6ea;
    --txt:#161b21; --muted:#67727e; --accent:#0a9d57; --accent2:#1f6fd6;
    --rumor:#d98700; --conf:#7b46c9; --done:#0a9d57; --red:#e0392b; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:14px;height:62px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
  .logo b{color:var(--accent)}
  .langsw{display:flex;gap:4px;margin-left:6px}
  .langsw a{font-size:11px;font-weight:700;padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer}
  .langsw a.on{background:var(--txt);color:#fff;border-color:var(--txt)}
  .nav{margin-left:auto;display:flex;gap:6px}
  .nav a{padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px}
  .nav a.on,.nav a:hover{color:var(--txt);border-color:var(--accent)}
  .upbar{display:flex;align-items:center;gap:14px;padding:8px 0;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(10,157,87,.6);animation:p 2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(10,157,87,.5)}70%{box-shadow:0 0 0 8px rgba(10,157,87,0)}100%{box-shadow:0 0 0 0 rgba(10,157,87,0)}}
  .slots{display:flex;gap:6px;margin-left:auto}
  .slot{padding:3px 10px;border:1px solid var(--line);border-radius:8px}
  .slot.done{color:var(--accent);border-color:rgba(10,157,87,.4)}
  .slot.next{color:var(--accent2);border-color:rgba(31,111,214,.4)}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 6px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
  .seg button{background:var(--bg);border:none;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.12s}
  .seg button.on{background:var(--accent);color:#fff}
  .ctrl-lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
  .teamsel{font-size:14px;font-weight:600;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:180px;cursor:pointer}
  .spacer{flex:1}
  @media(max-width:680px){.controls{gap:8px}.teamsel{flex:1;min-width:0;width:100%}.spacer{display:none}.viewseg{width:100%}.viewseg .seg{width:100%}.viewseg .seg button{flex:1}}
  .thead{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#f7f8fa,#eef1f5);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:12px 0 18px}
  .crest{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0}
  .thead .crest{width:52px;height:52px;font-size:18px;border-radius:12px}
  .thead h1{font-size:24px;letter-spacing:-.5px}
  .thead .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:24px}
  @media(max-width:880px){.board{grid-template-columns:1fr}}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .col h2{font-size:12px;text-transform:uppercase;letter-spacing:.8px;padding:12px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
  .col h2 .dot{width:9px;height:9px;border-radius:50%}
  .col h2 .n{margin-left:auto;font-size:11px;color:var(--muted);font-weight:400}
  .c-rumor .dot{background:var(--rumor)} .c-conf .dot{background:var(--conf)} .c-done .dot{background:var(--done)}
  .cards{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
  .card{display:block;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;transition:.12s;box-shadow:0 1px 2px rgba(20,30,45,.04)}
  .card:hover{border-color:#c7ced6;transform:translateY(-1px);box-shadow:0 4px 12px rgba(20,30,45,.08)}
  .card.livecard{border-color:rgba(224,57,43,.35);background:#fff7f6}
  .card .tit{font-weight:600;font-size:13px;line-height:1.25}
  .card .meta{font-size:11px;color:var(--muted);margin-top:7px;display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .src{border:1px solid var(--line);border-radius:999px;padding:1px 7px}
  .livetag{background:var(--red);color:#fff;border-radius:5px;padding:1px 6px;font-size:9.5px;font-weight:800;letter-spacing:.4px}
  .reli{display:inline-flex;gap:2px}.reli i{width:6px;height:6px;border-radius:50%;background:#cfd6dd}.reli i.on{background:var(--accent)}
  .empty{color:var(--muted);font-size:12px;padding:8px 4px}
  .notice{background:#fff9ec;border:1px solid #f0dca6;color:#8a6d1f;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
  .mv{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--bg);box-shadow:0 1px 2px rgba(20,30,45,.04)}
  .mv.in{border-left-color:var(--done)} .mv.out{border-left-color:#d23b3b}
  .mv .dir{font-size:9.5px;font-weight:800;letter-spacing:.5px;padding:1px 7px;border-radius:5px}
  .mv.in .dir{background:rgba(10,157,87,.14);color:var(--done)} .mv.out .dir{background:rgba(210,59,59,.12);color:#d23b3b}
  .mv .pl{font-weight:700;font-size:14px;margin-top:6px}
  .mv .club{font-size:12px;color:var(--muted);margin-top:1px}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .panelbox h2.t{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .panelbox .day{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .feed{display:flex;flex-direction:column}
  .item{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .time{font-size:12px;color:var(--muted);width:60px;flex-shrink:0;padding-top:1px}
  .item .body{flex:1}
  .item .tag{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:8px}
  .t-rumor{background:rgba(217,135,0,.14);color:var(--rumor)}.t-conf{background:rgba(123,70,201,.14);color:var(--conf)}.t-done{background:rgba(10,157,87,.14);color:var(--done)}
  .item .txt{font-size:14px;margin-top:5px;display:block}
  .item .src2{font-size:11.5px;color:var(--muted);margin-top:4px}
  .item .src2 a{color:var(--accent2);font-weight:600}
  .thumb{flex-shrink:0;width:96px;height:66px;border-radius:8px;overflow:hidden;background:var(--panel2);display:block}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  @media(max-width:560px){.thumb{width:72px;height:54px}}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0;border-top:1px solid var(--line);margin-top:10px}
  .demo{display:inline-block;background:rgba(217,135,0,.12);color:var(--rumor);border:1px solid rgba(217,135,0,.3);padding:2px 9px;border-radius:6px;font-size:11px;margin-left:8px}
  .err{background:#fff6f6;border:1px solid #f3c9c9;color:#a33;border-radius:12px;padding:16px 18px;margin:24px 0;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="top">
      <div class="logo">⚽ Transfer<b>Beat</b><span class="demo">BETA</span></div>
      <div class="langsw" id="langsw"></div>
      <div class="nav"><a href="index.html" id="navHome">Home</a><a href="board.html" class="on" id="navLive">Live</a></div>
    </div>
    <div class="upbar">
      <span class="pulse"></span> <span id="lblUpd">Aggiornato alle</span> <b id="lastUp">—</b>
      <div class="slots"><span class="slot" id="s08">08:00</span><span class="slot" id="s12">12:00</span><span class="slot" id="s20">20:00</span></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div id="error"></div>
  <div class="controls">
    <span class="ctrl-lab" id="lblLeague">Campionato</span>
    <div class="seg" id="leagues"></div>
    <select class="teamsel" id="teamSelect"></select>
    <div class="spacer"></div>
    <div class="viewseg"><div class="seg">
      <button id="vNews" class="on">📰 Notizie</button>
      <button id="vNames">🔁 Nomi</button>
    </div></div>
  </div>
  <div class="thead" id="thead"></div>
  <div id="notice"></div>
  <div class="board" id="board"></div>
  <div class="panelbox">
    <h2 class="t" id="lblFeed">📰 Feed di giornata</h2>
    <div class="day" id="feedDay"></div>
    <div class="feed" id="feed"></div>
  </div>
</div>
<footer id="foot"></footer>

<script>
const STRINGS={
 it:{home:'Home',live:'Live',updated:'Aggiornato alle',league:'Campionato',news:'📰 Notizie',names:'🔁 Nomi',feed:'📰 Feed di giornata',sub:'trattative monitorate in tempo reale',source:'Fonte',none:'Nessuna voce',
    notice:'Vista <b>Nomi</b> non ancora popolata per questa squadra.',
    err:'<b>Dati non caricati.</b> Apri il sito tramite un server (o GitHub/Vercel), non con doppio clic. In locale: <code>python -m http.server</code>',
    feedday:'fonti pubbliche, affidabilità stimata',foot:'TransferBeat · dati da feed pubblici + esperti, classificati automaticamente',
    cols:['Rumors','Trattative confermate','Trattative concluse'],tags:{rumor:'Rumor',conf:'Confermata',done:'Conclusa'},dir:{out:'USCITA',in:'ENTRATA'}},
 en:{home:'Home',live:'Live',updated:'Updated at',league:'League',news:'📰 News',names:'🔁 Names',feed:'📰 Today’s feed',sub:'deals tracked in real time',source:'Source',none:'Nothing',
    notice:'The <b>Names</b> view is not populated yet for this club.',
    err:'<b>Data not loaded.</b> Open the site via a server (or GitHub/Vercel), not by double-clicking.',
    feedday:'public sources, estimated reliability',foot:'TransferBeat · data from public feeds + experts, auto-classified',
    cols:['Rumours','Confirmed talks','Done deals'],tags:{rumor:'Rumour',conf:'Confirmed',done:'Done'},dir:{out:'OUT',in:'IN'}},
 es:{home:'Inicio',live:'En vivo',updated:'Actualizado a las',league:'Liga',news:'📰 Noticias',names:'🔁 Nombres',feed:'📰 Noticias del día',sub:'fichajes seguidos en tiempo real',source:'Fuente',none:'Nada',
    notice:'La vista <b>Nombres</b> aún no está disponible para este equipo.',
    err:'<b>Datos no cargados.</b> Abre el sitio con un servidor (o GitHub/Vercel), no con doble clic.',
    feedday:'fuentes públicas, fiabilidad estimada',foot:'TransferBeat · datos de feeds públicos + expertos, clasificados automáticamente',
    cols:['Rumores','Negociaciones confirmadas','Cerrados'],tags:{rumor:'Rumor',conf:'Acordado',done:'Cerrado'},dir:{out:'SALE',in:'LLEGA'}}
};
// 3 colonne; gli "obj" vengono accorpati ai Rumors
const COLS=[{cls:'c-rumor',states:['rumor','obj']},{cls:'c-conf',states:['conf']},{cls:'c-done',states:['done']}];
function dispCol(stato){return stato==='conf'?1:(stato==='done'?2:0);}  // rumor/obj->0
const LIVE_URL="https://raw.githubusercontent.com/ultimacenere/transferbeat/live/data/ultimora.json";

const PARAMS=new URLSearchParams(location.search);
let lang=(PARAMS.get('lang')||localStorage.getItem('tb_lang')||'it').toLowerCase();
if(!['it','en','es'].includes(lang))lang='it';
localStorage.setItem('tb_lang',lang); document.documentElement.lang=lang;
const T=STRINGS[lang];
const LEAGUE_ORDER=['Serie A','La Liga','Premier'];
let DATA={}, META={}, curLeague=null, curTeam=null, viewMode='news', ULTIMORA=[], ART={};
function artUrl(slug){return 'articoli/'+lang+'/'+slug+'.html';}
function loadArticles(){
  fetch('data/articles/index.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&d.articoli){ART={};d.articoli.forEach(a=>ART[a.slug]=a);if(curTeam)renderTeam();}
  }).catch(()=>{});
}

function dots(n){return '<span class="reli">'+[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')+'</span>';}
function agoISO(ts){try{const h=Math.floor((Date.now()-new Date(ts))/3600000);if(h<1)return 'ora';if(h<24)return h+'h';return Math.floor(h/24)+'g';}catch(e){return '';}}
function leaguesPresent(){const set=new Set(Object.values(DATA).map(v=>v.league));return LEAGUE_ORDER.filter(l=>set.has(l));}
function teamsOf(league){return Object.entries(DATA).filter(([k,v])=>v.league===league).map(([k])=>k).sort((a,b)=>a.localeCompare(b));}

function applyStatic(){
  document.getElementById('navHome').textContent=T.home;
  document.getElementById('navLive').textContent=T.live;
  document.getElementById('lblUpd').textContent=T.updated;
  document.getElementById('lblLeague').textContent=T.league;
  document.getElementById('vNews').textContent=T.news;
  document.getElementById('vNames').textContent=T.names;
  document.getElementById('lblFeed').textContent=T.feed;
  document.getElementById('foot').textContent=T.foot;
  const ls=document.getElementById('langsw');
  ls.innerHTML=['it','en','es'].map(l=>`<a data-l="${l}" class="${l===lang?'on':''}">${l.toUpperCase()}</a>`).join('');
  ls.querySelectorAll('a').forEach(a=>a.onclick=()=>{localStorage.setItem('tb_lang',a.dataset.l);location.search='?lang='+a.dataset.l;});
}
function init(){
  applyStatic();
  fetch('data/'+lang+'/board.json').then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(d=>{
      META=d; DATA=d.squadre;
      document.getElementById('lastUp').textContent=(d.aggiornato||'').slice(11,16)||'—';
      markSlot((d.aggiornato||'').slice(11,13));
      const present=leaguesPresent(); const wanted=PARAMS.get('lega');
      curLeague=present.includes(wanted)?wanted:present[0];
      const lb=document.getElementById('leagues');
      lb.innerHTML=present.map(l=>`<button data-l="${l}">${l}</button>`).join('');
      lb.querySelectorAll('button').forEach(b=>b.onclick=()=>{curLeague=b.dataset.l;syncLeague();fillTeams();renderTeam();});
      const sel=document.getElementById('teamSelect'); sel.onchange=()=>{curTeam=sel.value;renderTeam();};
      const setMode=(m)=>{viewMode=m;
        document.getElementById('vNews').className=m==='news'?'on':'';
        document.getElementById('vNames').className=m==='names'?'on':'';renderTeam();};
      document.getElementById('vNews').onclick=()=>setMode('news');
      document.getElementById('vNames').onclick=()=>setMode('names');
      syncLeague(); fillTeams(); renderTeam();
      loadArticles(); loadUltimora(); setInterval(loadUltimora,60000);
    })
    .catch(()=>{document.getElementById('error').innerHTML='<div class="err">'+T.err+'</div>';});
}
function loadUltimora(){
  fetch(LIVE_URL+'?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&d.items){ULTIMORA=d.items;if(curTeam)renderTeam();}
  }).catch(()=>{});
}
function syncLeague(){document.querySelectorAll('#leagues button').forEach(b=>b.className=b.dataset.l===curLeague?'on':'');}
function fillTeams(){
  const sel=document.getElementById('teamSelect'); const teams=teamsOf(curLeague);
  sel.innerHTML=teams.map(t=>{const tot=Object.values(DATA[t].colonne).reduce((a,c)=>a+c.length,0);return `<option value="${t}">${t} (${tot})</option>`;}).join('');
  curTeam=teams[0]; sel.value=curTeam;
}
function markSlot(h){h=parseInt(h);const map=[['s08',8],['s12',12],['s20',20]];
  map.forEach(([id,hh])=>{const e=document.getElementById(id);if(!isNaN(h)&&h>=hh){e.className='slot done';e.textContent=hh.toString().padStart(2,'0')+':00 ✓';}});
  const next=map.find(([id,hh])=>h<hh);if(next)document.getElementById(next[0]).className='slot next';}
function renderTeam(){
  const v=DATA[curTeam];if(!v)return;
  document.getElementById('thead').innerHTML=
    `<span class="crest" style="background:${v.col}">${v.lab}</span>
     <div><h1>${curTeam}</h1><div class="sub">${v.league} · ${T.sub}</div></div>`;
  const liveTeam=(ULTIMORA||[]).filter(i=>i.team===curTeam);
  const norm=x=>(x||'').toLowerCase().replace(/[^a-zà-ù ]/g,'').trim();
  const canon={}; ['done','conf','obj','rumor'].forEach(st=>((v.nomi&&v.nomi[st])||[]).forEach(m=>{if(m.giocatore)canon[norm(m.giocatore)]=st;}));
  const liveCol=i=>{ if(i.giocatore&&!i.smentita){const c=canon[norm(i.giocatore)]; if(c!==undefined)return dispCol(c);} return dispCol(i.stato); };
  const board=document.getElementById('board');board.innerHTML='';
  const totNomi=v.nomi?Object.values(v.nomi).reduce((a,x)=>a+x.length,0):0;
  document.getElementById('notice').innerHTML=(viewMode==='names'&&totNomi===0)?('<div class="notice">'+T.notice+'</div>'):'';
  COLS.forEach((col,idx)=>{
    const el=document.createElement('div');el.className='col '+col.cls;
    let inner='', count=0;
    if(viewMode==='names'){
      const liveMovs=liveTeam.filter(i=>i.giocatore&&canon[norm(i.giocatore)]===undefined&&dispCol(i.stato)===idx);
      let movs=[]; col.states.forEach(st=>movs=movs.concat((v.nomi&&v.nomi[st])||[]));
      count=liveMovs.length+movs.length;
      const mvCard=(m,live)=>`<div class="mv ${m.direzione==='out'?'out':'in'}">
          <span class="dir">${m.direzione==='out'?T.dir.out:T.dir.in}</span>${live?' <span class="livetag">🔴 LIVE</span>':''}
          <div class="pl">${m.giocatore}</div>
          <div class="club">${m.direzione==='out'?'→':'←'} ${m.club||'—'}</div></div>`;
      inner=(liveMovs.map(m=>mvCard(m,true)).join('')+movs.map(m=>mvCard(m,false)).join(''))||'<div class="empty">—</div>';
    } else {
      const liveHere=liveTeam.filter(i=>liveCol(i)===idx);
      let items=[]; col.states.forEach(st=>items=items.concat(v.colonne[st]||[]));
      count=liveHere.length+items.length;
      const liveHtml=liveHere.map(i=>{const has=i.slug&&ART[i.slug];
          const inner=`<div class="tit">${i.titolo}</div>
          <div class="meta"><span class="livetag">🔴 LIVE</span><span class="src">${i.fonte}</span>${dots(i.tier)}<span>${agoISO(i.ts)}</span></div>`;
          return has?`<a class="card livecard" href="${artUrl(i.slug)}">${inner}</a>`:`<div class="card livecard" style="cursor:default">${inner}</div>`;}).join('');
      const newsHtml=items.map(c=>`<a class="card" href="${c.link||'#'}" target="_blank" rel="noopener">
          <div class="tit">${c.titolo}</div>
          <div class="meta"><span class="src">${c.fonte}</span>${dots(c.affidabilita)}<span>${c.quando||''}</span></div></a>`).join('');
      inner=(liveHtml+newsHtml)||('<div class="empty">'+T.none+'</div>');
    }
    el.innerHTML=`<h2><span class="dot"></span>${T.cols[idx]}<span class="n">${count}</span></h2><div class="cards">${inner}</div>`;
    board.appendChild(el);
  });
  // feed: prima le voci live della squadra, poi il feed del giorno
  document.getElementById('feedDay').textContent=(META.giorno||'')+' · '+T.feedday;
  const feed=document.getElementById('feed');feed.innerHTML='';
  const dispStato=s=>s==='obj'?'rumor':s;
  liveTeam.forEach(i=>{
    const it=document.createElement('div');it.className='item';
    const hasA=i.slug&&ART[i.slug];
    it.innerHTML=`<div class="time">${agoISO(i.ts)}</div>
      <div class="body"><span class="livetag">🔴 LIVE</span> <span class="tag t-${dispStato(i.stato)}">${T.tags[dispStato(i.stato)]}</span>
      ${hasA?`<a class="txt" href="${artUrl(i.slug)}">${i.titolo}</a>`:`<span class="txt">${i.titolo}</span>`}
      <div class="src2">${T.source}: ${i.fonte}</div></div>`;
    feed.appendChild(it);
  });
  (v.feed||[]).forEach(f=>{
    const it=document.createElement('div');it.className='item';
    const thumb=f.img?`<a class="thumb" href="${f.link||'#'}" target="_blank" rel="noopener"><img src="${f.img}" loading="lazy" alt="" onerror="this.closest('.thumb').style.display='none'"></a>`:'';
    it.innerHTML=`<div class="time">${f.quando||''}</div>${thumb}
      <div class="body"><span class="tag t-${dispStato(f.stato)}">${T.tags[dispStato(f.stato)]}</span>${dots(f.affidabilita)}
      <a class="txt" href="${f.link||'#'}" target="_blank" rel="noopener">${f.titolo}</a>
      <div class="src2">${T.source}: <a href="${f.link||'#'}" target="_blank" rel="noopener">${f.fonte}</a>${f.dominio?' · '+f.dominio:''}</div></div>`;
    feed.appendChild(it);
  });
}
init();
</script>
</body>
