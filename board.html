<style>
  :root{
    --bg:#ffffff; --panel:#f7f8fa; --panel2:#eef1f5; --line:#e2e6ea;
    --txt:#161b21; --muted:#67727e; --accent:#0a9d57; --accent2:#1f6fd6;
    --rumor:#d98700; --conf:#7b46c9; --done:#0a9d57; --red:#e0392b; --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--txt);line-height:1.45}
  a{color:inherit;text-decoration:none}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
  .top{display:flex;align-items:center;gap:14px;height:62px}
  .logo{font-weight:800;font-size:20px;letter-spacing:-.5px;display:flex;align-items:center;gap:8px}
  .logo b{color:var(--accent)}
  .langsw{display:flex;gap:4px;margin-left:6px}
  .langsw a{font-size:11px;font-weight:700;padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);cursor:pointer}
  .langsw a.on{background:var(--txt);color:#fff;border-color:var(--txt)}
  .nav{margin-left:auto;display:flex;gap:6px}
  .nav a{padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:999px}
  .nav a.on,.nav a:hover{color:var(--txt);border-color:var(--accent)}
  .upbar{display:flex;align-items:center;gap:14px;padding:8px 0;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(10,157,87,.6);animation:p 2s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(10,157,87,.5)}70%{box-shadow:0 0 0 8px rgba(10,157,87,0)}100%{box-shadow:0 0 0 0 rgba(10,157,87,0)}}
  .slots{display:flex;gap:6px;margin-left:auto}
  .slot{padding:3px 10px;border:1px solid var(--line);border-radius:8px}
  .slot.done{color:var(--accent);border-color:rgba(10,157,87,.4)}
  .slot.next{color:var(--accent2);border-color:rgba(31,111,214,.4)}
  .controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px 0 6px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:wrap}
  .seg button{background:var(--bg);border:none;padding:8px 15px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted);transition:.12s}
  .seg button.on{background:var(--accent);color:#fff}
  .ctrl-lab{font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);font-weight:700}
  .teamsel{font-size:14px;font-weight:600;color:var(--txt);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-width:180px;cursor:pointer}
  .spacer{flex:1}
  @media(max-width:680px){.controls{gap:8px}.teamsel{flex:1;min-width:0;width:100%}.spacer{display:none}}
  .thead{display:flex;align-items:center;gap:16px;background:linear-gradient(120deg,#f7f8fa,#eef1f5);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px;margin:12px 0 18px}
  .crest{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;font-weight:800;font-size:12px;color:#fff;flex-shrink:0}
  .thead .crest{width:52px;height:52px;font-size:18px;border-radius:12px}
  .thead h1{font-size:24px;letter-spacing:-.5px}
  .thead .sub{color:var(--muted);font-size:13px;margin-top:2px}
  .board{margin-bottom:24px}
  .glob-h{display:flex;align-items:center;gap:10px;margin:14px 0 2px}
  .glob-h h1{font-size:20px;letter-spacing:-.4px}
  .howto{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin:8px 0 2px;font-size:13px;overflow:hidden}
  .howto summary{cursor:pointer;padding:12px 16px;font-weight:600;color:var(--txt);list-style:none;display:flex;align-items:center;gap:8px}
  .howto summary::-webkit-details-marker{display:none}
  .howto summary::before{content:'\2139';color:var(--accent2);font-weight:800}
  .howto[open] summary{border-bottom:1px solid var(--line)}
  .howto .hb{padding:12px 16px;color:var(--muted);line-height:1.6}
  .howto .hb b{color:var(--txt)} .howto .hb p{margin-bottom:9px} .howto .hb p:last-child{margin-bottom:0}
  .howto .stg{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 7px;font-size:11.5px;margin:0 1px}
  .sech{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--txt);margin:22px 0 10px}
  .sech .n{color:var(--muted);font-weight:400;font-size:12px}
  .deals{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:12px}
  .deal{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;box-shadow:0 1px 2px rgba(20,30,45,.04)}
  .deal-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .pl2{font-weight:700;font-size:15px} .route{font-size:13px;color:var(--muted);margin-top:2px} .route b{color:var(--txt)}
  .metro{margin-top:13px}
  .segbar{height:8px;border-radius:6px;background:var(--panel2);overflow:hidden} .segbar.s6{height:6px}
  .segfill{height:100%;background:var(--accent);border-radius:6px;transition:width .5s ease}
  .stages{display:flex;justify-content:space-between;margin-top:6px;font-size:10.5px;color:var(--muted)}
  .stages .cur{color:var(--accent);font-weight:700}
  .dsrc{margin-top:10px;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:8px;white-space:nowrap}
  .c-hot{background:rgba(224,57,43,.12);color:#d23b3b} .c-warm{background:rgba(217,135,0,.14);color:var(--rumor)} .c-cold{background:var(--panel2);color:var(--muted)}
  .cdone{background:rgba(10,157,87,.14);color:var(--done)}
  .seclist{display:flex;flex-direction:column;gap:8px}
  .mrow{display:flex;align-items:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
  .mrow-i{flex:1;min-width:0} .pl3{font-weight:600;font-size:14px} .route2{font-size:11.5px;color:var(--muted);margin-top:1px} .route2 b{color:var(--txt)}
  .mbar{width:104px;flex-shrink:0}
  @media(max-width:560px){.mbar{display:none}}
  .col{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
  .cards{padding:10px;display:flex;flex-direction:column;gap:9px;min-height:60px}
  .empty{color:var(--muted);font-size:12px;padding:8px 4px}
  .notice{background:#fff9ec;border:1px solid #f0dca6;color:#8a6d1f;border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:13px}
  .livetag{background:var(--red);color:#fff;border-radius:5px;padding:1px 6px;font-size:9.5px;font-weight:800;letter-spacing:.4px}
  .reli{display:inline-flex;gap:2px}.reli i{width:6px;height:6px;border-radius:50%;background:#cfd6dd}.reli i.on{background:var(--accent)}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px 20px}
  .panelbox h2.t{font-size:15px;margin-bottom:4px;display:flex;align-items:center;gap:9px}
  .panelbox .day{color:var(--muted);font-size:12.5px;margin-bottom:14px}
  .feed{display:flex;flex-direction:column}
  .item{display:flex;gap:14px;padding:13px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:none}
  .time{font-size:12px;color:var(--muted);width:60px;flex-shrink:0;padding-top:1px}
  .item .body{flex:1}
  .item .tag{font-size:10px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;padding:1px 7px;border-radius:5px;margin-right:8px}
  .t-rumor{background:rgba(217,135,0,.14);color:var(--rumor)}.t-conf{background:rgba(123,70,201,.14);color:var(--conf)}.t-done{background:rgba(10,157,87,.14);color:var(--done)}
  .item .txt{font-size:14px;margin-top:5px;display:block}
  .item .src2{font-size:11.5px;color:var(--muted);margin-top:4px}
  .item .src2 a{color:var(--accent2);font-weight:600}
  .thumb{flex-shrink:0;width:96px;height:66px;border-radius:8px;overflow:hidden;background:var(--panel2);display:block}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block}
  @media(max-width:560px){.thumb{width:72px;height:54px}}
  footer{color:var(--muted);font-size:12px;text-align:center;padding:30px 0;border-top:1px solid var(--line);margin-top:10px}
  .demo{display:inline-block;background:rgba(217,135,0,.12);color:var(--rumor);border:1px solid rgba(217,135,0,.3);padding:2px 9px;border-radius:6px;font-size:11px;margin-left:8px}
  .err{background:#fff6f6;border:1px solid #f3c9c9;color:#a33;border-radius:12px;padding:16px 18px;margin:24px 0;font-size:14px}
</style>
</head>

<script>
const STRINGS={
 it:{home:'Home',live:'Live',updated:'Aggiornato alle',league:'Campionato',feed:'📰 Feed di giornata',sub:'trattative monitorate in tempo reale',source:'Fonte',none:'Nessuna voce',
    err:'<b>Dati non caricati.</b> Apri il sito tramite un server (o GitHub/Vercel), non con doppio clic. In locale: <code>python -m http.server</code>',
    feedday:'fonti pubbliche, affidabilità stimata',foot:'TransferBeat · dati da feed pubblici + esperti, classificati automaticamente',
    tags:{rumor:'Rumor',conf:'Confermata',done:'Conclusa'},
    stages:['Voce','Trattativa','Accordo','Ufficiale'],heat:{hot:'caldo',warm:'tiepido',cold:'freddo',official:'ufficiale'},
    sections:{top:'Affari principali',in:'In entrata',out:'In uscita',done:'Conclusi'},allTeams:'🌍 Tutte le squadre',globalTitle:'Tutti gli affari',fontiNav:'Fonti',fontiLink:'Vedi tutte le fonti e i tier →',howtoTitle:'Come leggiamo il mercato',howtoBody:'<div class="hb"><p><b>L’affare-metro</b> mostra quanto una trattativa è vicina alla chiusura, in quattro stadi: <span class="stg">Voce</span> → <span class="stg">Trattativa</span> → <span class="stg">Accordo</span> → <span class="stg">Ufficiale</span>.</p><p><b>Il calore (%) non è un numero a caso.</b> Lo calcoliamo da quattro segnali reali: lo stadio dell’affare, <b>quante</b> fonti lo riportano, <b>quanto sono affidabili</b>, e <b>quanto è fresca</b> la notizia.</p><p><b>I pallini = l’affidabilità della fonte (tier).</b> Tre pallini = fonte di primissimo piano (esperti di mercato riconosciuti), meno pallini = fonte meno consolidata. Una conferma da fonti di alto livello pesa più di una voce isolata.</p></div>'},
 en:{home:'Home',live:'Live',updated:'Updated at',league:'League',feed:'📰 Today’s feed',sub:'deals tracked in real time',source:'Source',none:'Nothing',
    err:'<b>Data not loaded.</b> Open the site via a server (or GitHub/Vercel), not by double-clicking.',
    feedday:'public sources, estimated reliability',foot:'TransferBeat · data from public feeds + experts, auto-classified',
    tags:{rumor:'Rumour',conf:'Confirmed',done:'Done'},
    stages:['Rumour','Talks','Agreed','Official'],heat:{hot:'hot',warm:'warm',cold:'cold',official:'official'},
    sections:{top:'Top deals',in:'Incoming',out:'Outgoing',done:'Done'},allTeams:'🌍 All clubs',globalTitle:'All deals',fontiNav:'Sources',fontiLink:'See all sources and tiers →',howtoTitle:'How we read the market',howtoBody:'<div class="hb"><p><b>The deal-meter</b> shows how close a deal is, in four stages: <span class="stg">Rumour</span> → <span class="stg">Talks</span> → <span class="stg">Agreed</span> → <span class="stg">Official</span>.</p><p><b>The heat (%) is not a random number.</b> We compute it from four real signals: the stage of the deal, <b>how many</b> sources report it, <b>how reliable</b> they are, and <b>how fresh</b> the news is.</p><p><b>The dots = source reliability (tier).</b> Three dots = a top-tier source (recognised market insiders), fewer dots = a less established one. A confirmation from high-tier sources weighs more than a single isolated rumour.</p></div>'},
 es:{home:'Inicio',live:'En vivo',updated:'Actualizado a las',league:'Liga',feed:'📰 Noticias del día',sub:'fichajes seguidos en tiempo real',source:'Fuente',none:'Nada',
    err:'<b>Datos no cargados.</b> Abre el sitio con un servidor (o GitHub/Vercel), no con doble clic.',
    feedday:'fuentes públicas, fiabilidad estimada',foot:'TransferBeat · datos de feeds públicos + expertos, clasificados automáticamente',
    tags:{rumor:'Rumor',conf:'Acordado',done:'Cerrado'},
    stages:['Rumor','Negociación','Acuerdo','Oficial'],heat:{hot:'caliente',warm:'templado',cold:'frío',official:'oficial'},
    sections:{top:'Operaciones destacadas',in:'Llegadas',out:'Salidas',done:'Cerrados'},allTeams:'🌍 Todos los equipos',globalTitle:'Todas las operaciones',fontiNav:'Fuentes',fontiLink:'Ver todas las fuentes y tiers →',howtoTitle:'Cómo leemos el mercado',howtoBody:'<div class="hb"><p><b>El medidor de fichajes</b> muestra cuánto se acerca una operación, en cuatro fases: <span class="stg">Rumor</span> → <span class="stg">Negociación</span> → <span class="stg">Acuerdo</span> → <span class="stg">Oficial</span>.</p><p><b>El calor (%) no es un número al azar.</b> Lo calculamos con cuatro señales reales: la fase de la operación, <b>cuántas</b> fuentes la dan, <b>cuán fiables</b> son, y <b>cuán reciente</b> es la noticia.</p><p><b>Los puntos = la fiabilidad de la fuente (tier).</b> Tres puntos = fuente de primer nivel (expertos reconocidos), menos puntos = fuente menos consolidada. Una confirmación de fuentes de alto nivel pesa más que un rumor aislado.</p></div>'}
};
const LIVE_URL="https://raw.githubusercontent.com/ultimacenere/transferbeat/live/data/ultimora.json";

const PARAMS=new URLSearchParams(location.search);
let lang=(PARAMS.get('lang')||localStorage.getItem('tb_lang')||'it').toLowerCase();
if(!['it','en','es'].includes(lang))lang='it';
localStorage.setItem('tb_lang',lang); document.documentElement.lang=lang;
const T=STRINGS[lang];
const LEAGUE_ORDER=['Serie A','La Liga','Premier'];
let DATA={}, META={}, curLeague=null, curTeam='', ULTIMORA=[], ART={};
function artUrl(slug){return 'articoli/'+lang+'/'+slug+'.html';}
function loadArticles(){
  fetch('data/articles/index.json?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&d.articoli){ART={};d.articoli.forEach(a=>ART[a.slug]=a);renderTeam();}
  }).catch(()=>{});
}
function dots(n){return '<span class="reli">'+[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')+'</span>';}
function agoISO(ts){try{const h=Math.floor((Date.now()-new Date(ts))/3600000);if(h<1)return 'ora';if(h<24)return h+'h';return Math.floor(h/24)+'g';}catch(e){return '';}}
function leaguesPresent(){const set=new Set(Object.values(DATA).map(v=>v.league));return LEAGUE_ORDER.filter(l=>set.has(l));}
function teamsOf(league){return Object.entries(DATA).filter(([k,v])=>v.league===league).map(([k])=>k).sort((a,b)=>a.localeCompare(b));}

function applyStatic(){
  document.getElementById('navHome').textContent=T.home;
  document.getElementById('navLive').textContent=T.live;
  const nf=document.getElementById('navFonti'); if(nf){nf.textContent=T.fontiNav;nf.href='fonti.html?lang='+lang;}
  const na=document.getElementById('navArticoli');
  if(na){na.textContent={it:'Articoli',en:'Articles',es:'Artículos'}[lang];na.href='articoli/'+lang+'/';}
  const nm=document.getElementById('navMondiale');
  if(nm){nm.textContent={it:'Mondiale',en:'World Cup',es:'Mundial'}[lang];nm.href='mondiali.html?lang='+lang;}
  document.getElementById('lblUpd').textContent=T.updated;
  document.getElementById('lblLeague').textContent=T.league;
  document.getElementById('lblFeed').textContent=T.feed;
  const hw=document.getElementById('howto'); if(hw)hw.innerHTML='<summary>'+T.howtoTitle+'</summary>'+T.howtoBody+'<div style="padding:0 16px 13px"><a href="fonti.html?lang='+lang+'" style="color:var(--accent2);font-weight:600;font-size:13px">'+T.fontiLink+'</a></div>';
  document.getElementById('foot').textContent=T.foot;
  const ls=document.getElementById('langsw');
  ls.innerHTML=['it','en','es'].map(l=>`<a data-l="${l}" class="${l===lang?'on':''}">${l.toUpperCase()}</a>`).join('');
  ls.querySelectorAll('a').forEach(a=>a.onclick=()=>{localStorage.setItem('tb_lang',a.dataset.l);location.search='?lang='+a.dataset.l;});
}
function init(){
  applyStatic();
  fetch('data/'+lang+'/board.json').then(r=>{if(!r.ok)throw 0;return r.json();})
    .then(d=>{
      META=d; DATA=d.squadre;
      document.getElementById('lastUp').textContent=(d.aggiornato||'').slice(11,16)||'—';
      markSlot((d.aggiornato||'').slice(11,13));
      const present=leaguesPresent(); const wanted=PARAMS.get('lega');
      curLeague=present.includes(wanted)?wanted:present[0];
      const lb=document.getElementById('leagues');
      lb.innerHTML=present.map(l=>`<button data-l="${l}">${l}</button>`).join('');
      lb.querySelectorAll('button').forEach(b=>b.onclick=()=>{curLeague=b.dataset.l;syncLeague();fillTeams();renderTeam();});
      const sel=document.getElementById('teamSelect'); sel.onchange=()=>{curTeam=sel.value;renderTeam();};
      syncLeague(); fillTeams(); renderTeam();
      loadArticles(); loadUltimora(); setInterval(loadUltimora,60000);
    })
    .catch(()=>{document.getElementById('error').innerHTML='<div class="err">'+T.err+'</div>';});
}
function loadUltimora(){
  fetch(LIVE_URL+'?t='+Date.now()).then(r=>r.ok?r.json():null).then(d=>{
    if(d&&d.items){ULTIMORA=d.items;renderTeam();}
  }).catch(()=>{});
}
function syncLeague(){document.querySelectorAll('#leagues button').forEach(b=>b.className=b.dataset.l===curLeague?'on':'');}
function fillTeams(){
  const sel=document.getElementById('teamSelect'); const teams=teamsOf(curLeague);
  sel.innerHTML=`<option value="">${T.allTeams}</option>`+teams.map(t=>`<option value="${t}">${t}</option>`).join('');
  curTeam=''; sel.value='';
}
function markSlot(h){h=parseInt(h);const map=[['s08',9],['s12',12],['s20',20]];
  map.forEach(([id,hh])=>{const e=document.getElementById(id);if(!isNaN(h)&&h>=hh){e.className='slot done';e.textContent=hh.toString().padStart(2,'0')+':00 ✓';}});
  const next=map.find(([id,hh])=>h<hh);if(next)document.getElementById(next[0]).className='slot next';}

const norm=x=>(x||'').toLowerCase().replace(/[^a-zà-ù ]/g,'').trim();
const STAGE_OF={rumor:0,obj:1,conf:2,done:3};
const STAGE_W=[25,50,75,100];
function daysSince(iso){try{if(!iso)return 0;const t=new Date(iso+'T00:00:00');return Math.floor((Date.now()-t)/86400000);}catch(e){return 0;}}
function heatOf(st,m,live){
  if(st==='done')return 100;
  let h=({rumor:25,obj:50,conf:72})[st]||25;
  if(m&&m._seen&&m._first&&m._seen>m._first)h+=8;
  const d=(m&&m._seen)?daysSince(m._seen):0;
  if(d<=0)h+=6; else if(d>=2)h-=8;
  if(live&&live.tier>=3)h+=4;
  const hrs=(typeof META!=='undefined'&&META.aggiornato)?Math.max(0,(Date.now()-new Date(META.aggiornato))/3600000):0;
  h-=Math.min(Math.max(hrs-2,0)*2,14);  // decadimento in tempo reale: dopo 2h -2/h, max -14
  return Math.max(5,Math.min(99,Math.round(h)));
}
function heatBand(h,st){return st==='done'?'done':(h>=70?'hot':(h>=45?'warm':'cold'));}
function buildMov(team,m,st,live){
  const isOut=m.direzione==='out';
  const from=isOut?team:(m.club||'?');
  const to=isOut?(m.club||'?'):team;
  const stg=(STAGE_OF[st]!==undefined)?STAGE_OF[st]:0;
  const h=heatOf(st,m,live);
  return {player:m.giocatore,from,to,dir:isOut?'out':'in',st,stage:stg,heat:h,band:heatBand(h,st),live:live||null,_seen:m._seen||''};
}
function teamMovements(team){
  const v=DATA[team]; const res=[]; const seen={};
  const liveByName={}; (ULTIMORA||[]).filter(i=>i.team===team&&i.giocatore&&!i.smentita).forEach(i=>{liveByName[norm(i.giocatore)]=i;});
  ['done','conf','obj','rumor'].forEach(st=>((v.nomi&&v.nomi[st])||[]).forEach(m=>{
    if(!m.giocatore)return; const k=norm(m.giocatore); if(seen[k])return; seen[k]=1;
    res.push(buildMov(team,m,st,liveByName[k]||null));
  }));
  Object.keys(liveByName).forEach(k=>{ if(seen[k])return; seen[k]=1; const i=liveByName[k];
    res.push(buildMov(team,{giocatore:i.giocatore,direzione:i.direzione,club:i.club},i.stato||'rumor',i)); });
  return res;
}
function globalDeals(){
  const map={};
  Object.keys(DATA).forEach(team=>{ if(DATA[team].league!==curLeague)return;
    teamMovements(team).forEach(d=>{ const key=norm(d.player)+'|'+norm(d.from)+'>'+norm(d.to);
      const cur=map[key]; if(!cur||d.stage>cur.stage||(d.stage===cur.stage&&d.heat>cur.heat))map[key]=d; }); });
  return Object.values(map).sort((a,b)=>{
    const ad=a.st==='done'?1:0, bd=b.st==='done'?1:0;
    if(ad!==bd)return ad-bd;
    return b.heat-a.heat||b.stage-a.stage;
  }).slice(0,12);
}
function heatChip(d){ if(d.st==='done')return `<span class="chip cdone">✓ ${T.heat.official}</span>`;
  return `<span class="chip c-${d.band}">🔥 ${T.heat[d.band]} ${d.heat}%</span>`; }
function dealCard(d){
  const w=STAGE_W[d.stage];
  const stg=T.stages.map((s,i)=>`<span class="${i===d.stage?'cur':''}">${s}</span>`).join('');
  const src=d.live?`<div class="dsrc">${dots(d.live.tier)} ${d.live.fonte||''}${d.live.ts?' · '+agoISO(d.live.ts):''}</div>`:'';
  return `<div class="deal"><div class="deal-h"><div><div class="pl2">${d.player}</div><div class="route"><b>${d.from}</b> → <b>${d.to}</b></div></div>${heatChip(d)}</div>`
    +`<div class="metro"><div class="segbar"><div class="segfill" style="width:${w}%"></div></div><div class="stages">${stg}</div></div>${src}</div>`;
}
function miniRow(d){
  const w=STAGE_W[d.stage];
  return `<div class="mrow"><div class="mrow-i"><div class="pl3">${d.player}${d.live?' <span class="livetag">🔴</span>':''}</div><div class="route2"><b>${d.from}</b> → <b>${d.to}</b></div></div>`
    +`<div class="mbar"><div class="segbar s6"><div class="segfill" style="width:${w}%"></div></div></div><span class="chip c-${d.band}">${d.heat}%</span></div>`;
}
function doneRow(d){
  return `<div class="mrow"><div class="mrow-i"><div class="pl3">${d.player}</div><div class="route2"><b>${d.from}</b> → ${d.to}</div></div><span class="chip cdone">✓ ${T.heat.official}</span></div>`;
}
function section(label,arr,fn){
  return `<div class="sech">${label}<span class="n">${arr.length}</span></div><div class="seclist">${arr.map(fn).join('')||('<div class="empty">'+T.none+'</div>')}</div>`;
}
function renderGlobal(board){
  const deals=globalDeals();
  let h=`<div class="glob-h"><span class="pulse"></span><h1>${T.globalTitle} · ${curLeague}</h1></div>`;
  h+=`<div class="sech">🔥 ${T.sections.top}<span class="n">${deals.length}</span></div>`;
  h+=`<div class="deals">${deals.map(dealCard).join('')||('<div class="empty">'+T.none+'</div>')}</div>`;
  board.innerHTML=h;
}
function renderTeamView(board){
  const v=DATA[curTeam];
  document.getElementById('thead').innerHTML=`<span class="crest" style="background:${v.col}">${v.lab}</span><div><h1>${curTeam}</h1><div class="sub">${v.league} · ${T.sub}</div></div>`;
  const movs=teamMovements(curTeam);
  const principali=movs.filter(d=>d.st!=='done').slice().sort((a,b)=>b.heat-a.heat).slice(0,3);
  const entrata=movs.filter(d=>d.dir==='in'&&d.st!=='done').sort((a,b)=>b.heat-a.heat);
  const uscita=movs.filter(d=>d.dir==='out'&&d.st!=='done').sort((a,b)=>b.heat-a.heat);
  const conclusi=movs.filter(d=>d.st==='done').sort((a,b)=>(b._seen||'').localeCompare(a._seen||''));
  let h='';
  if(principali.length)h+=`<div class="sech">🔥 ${T.sections.top}</div><div class="deals">${principali.map(dealCard).join('')}</div>`;
  h+=section(T.sections.in,entrata,miniRow);
  h+=section(T.sections.out,uscita,miniRow);
  h+=section(T.sections.done,conclusi,doneRow);
  board.innerHTML=h;
}
function renderFeed(v){
  document.getElementById('feedDay').textContent=(META.giorno||'')+' · '+T.feedday;
  const feed=document.getElementById('feed');feed.innerHTML='';
  const dispStato=s=>s==='obj'?'rumor':s;
  (ULTIMORA||[]).filter(i=>i.team===curTeam).forEach(i=>{
    const it=document.createElement('div');it.className='item';
    const hasA=i.slug&&ART[i.slug];
    it.innerHTML=`<div class="time">${agoISO(i.ts)}</div><div class="body"><span class="livetag">🔴 LIVE</span> <span class="tag t-${dispStato(i.stato)}">${T.tags[dispStato(i.stato)]}</span> ${hasA?`<a class="txt" href="${artUrl(i.slug)}">${i.titolo}</a>`:`<a class="txt" href="${i.link||'#'}" target="_blank" rel="noopener">${i.titolo}</a>`}<div class="src2">${T.source}: ${i.fonte}</div></div>`;
    feed.appendChild(it);
  });
  (v.feed||[]).forEach(f=>{
    const it=document.createElement('div');it.className='item';
    const thumb=f.img?`<a class="thumb" href="${f.link||'#'}" target="_blank" rel="noopener"><img src="${f.img}" loading="lazy" alt="" onerror="this.closest('.thumb').style.display='none'"></a>`:'';
    it.innerHTML=`<div class="time">${f.quando||''}</div>${thumb}<div class="body"><span class="tag t-${dispStato(f.stato)}">${T.tags[dispStato(f.stato)]}</span>${dots(f.affidabilita)} <a class="txt" href="${f.link||'#'}" target="_blank" rel="noopener">${f.titolo}</a><div class="src2">${T.source}: <a href="${f.link||'#'}" target="_blank" rel="noopener">${f.fonte}</a>${f.dominio?' · '+f.dominio:''}</div></div>`;
    feed.appendChild(it);
  });
}
function renderTeam(){
  if(!DATA||!Object.keys(DATA).length)return;
  const board=document.getElementById('board');
  const thead=document.getElementById('thead');
  const panel=document.querySelector('.panelbox');
  document.getElementById('notice').innerHTML='';
  if(!curTeam){ thead.style.display='none'; if(panel)panel.style.display='none'; renderGlobal(board); return; }
  thead.style.display=''; if(panel)panel.style.display='';
  renderTeamView(board); renderFeed(DATA[curTeam]);
}
init();
</script>
</body>
</html>
