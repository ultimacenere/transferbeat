name: Aggiorna dati TransferBeat

# Orari in UTC. L'Italia e' UTC+2 (estate) / UTC+1 (inverno).
# Estate: 06:00, 10:00, 18:00 UTC = 08:00, 12:00, 20:00 ora italiana.
on:
  schedule:
    - cron: "0 6,10,18 * * *"
  workflow_dispatch: {}        # bottone per lanciarlo a mano dalla tab Actions

permissions:
  contents: write              # serve per fare commit dei JSON aggiornati

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Genera i dati
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # opzionale: abilita la vista "Nomi"
        run: python scripts/build.py

      - name: Commit dei JSON
        run: |
          git config user.name  "transferbeat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data
          git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M UTC')" || echo "Nessuna modifica"
          git push || echo "Niente da pushare"
