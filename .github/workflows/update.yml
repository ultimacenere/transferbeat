name: Aggiorna dati TransferBeat

# Orari in UTC. L'Italia e' UTC+2 (estate) / UTC+1 (inverno).
# Estate: 06:00, 10:00, 18:00 UTC = 08:00, 12:00, 20:00 ora italiana.
on:
  schedule:
    - cron: "0 6-22/2 * * *"    # ogni 2 ore, ~08:00-24:00 italiane (refresh frequente di board e Dal Mondo)
  workflow_dispatch: {}        # anche da cron-job.org o a mano

permissions:
  contents: write              # serve per fare commit dei JSON aggiornati

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Aggiorna rose (se chiave presente, refresh settimanale)
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/rosters.py || echo "rosters skip"

      - name: Genera i dati
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}   # opzionale: abilita la vista "Nomi"
        run: python scripts/build.py

      - name: Campionati e coppe (football-data)
        env:
          FOOTBALL_DATA_KEY: ${{ secrets.FOOTBALL_DATA_KEY }}
        run: python scripts/competizioni.py || echo "competizioni skip (la sentinella segnala se i dati invecchiano)"

      - name: Pagine statiche SEO (hub, squadre, competizioni, fantacalcio, chi siamo, sitemap, llms.txt)
        run: python scripts/render_site.py || echo "render_site FALLITO: restano le pagine precedenti (la sentinella lo segnala)"

      - name: Commit dei dati e degli articoli
        run: |
          git config user.name  "transferbeat-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -m "Aggiornamento dati $(date -u +'%Y-%m-%d %H:%M UTC')" || { echo "Nessuna modifica"; exit 0; }
          for i in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main || git rebase --abort
            if git push; then echo "Push ok (tentativo $i)"; python scripts/indexnow.py || true; exit 0; fi
            echo "Push respinto, ritento ($i)..."; sleep $(( (RANDOM % 6) + 3 ))
          done
          echo "ERRORE: push fallito dopo 5 tentativi"; exit 1

      - name: Sentinella freschezza dati (fallisce se i dati sono vecchi o vuoti)
        run: python scripts/freshness.py
