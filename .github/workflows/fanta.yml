name: FantaTB voti e listone

# Voti: sabato/domenica/lunedì sera e martedì mattina (UTC), per coprire anticipi, posticipi e infrasettimanali.
# Live: nei giorni di partita (ven-lun 12-22 UTC, mar-gio 17-22 UTC) ogni 30 minuti solo voti delle partite finite e
#       risultati provvisori delle leghe (~2-22 chiamate API per giro), senza pagine né commit.
# Rose: ogni giovedì alle 06:00 UTC sincronizza squadre/uscite/nuovi arrivi dal feed API-Football (prezzi invariati).
# Bot: le formazioni delle 7 squadre bot della lega Fantamarcio 26/27 (kb/FANTATB.md §19). La deadline è l'inizio della prima
#      partita della giornata (venerdì sera o sabato, ma anche martedì/mercoledì negli infrasettimanali), quindi lo step gira
#      in tutti i run non live/rose/listone (subito dopo le probabili, di cui legge il file) invece di avere una schedule sua: fra le schedule qui sotto c'è già almeno un run
#      al giorno (lun 07:00, mar 07:00, ven 07:00 e 15:00, sab 08:00, più le 21:30 di sab-gio), cioè non più di ~24 ore prima
#      di qualsiasi deadline possibile, e se una giornata slitta il run del giorno prima la prende comunque. Lo script si
#      ferma da solo se mancano più di 36 ore alla deadline, se la deadline è passata o se le formazioni ci sono già:
#      rilanciarlo non cambia niente, quindi non servono run in più.
on:
  schedule:
    - cron: "30 21 * * 6,0,1,2,3,4"
    - cron: "0 7 * * 1,2,5"
    - cron: "0 6 * * 4"
    - cron: "*/30 12-22 * * 5,6,0,1"
    - cron: "*/30 17-22 * * 2,3,4"
    - cron: "0 15 * * 5"
    - cron: "0 8 * * 6"
  workflow_dispatch:
    inputs:
      task:
        description: "voti | live (solo voti e risultati provvisori, niente pagine) | rose (sincronizza rose, prezzi invariati) | listone (ricalcola anche i prezzi)"
        default: "voti"
      matchday:
        description: "numero giornata (vuoto = automatico)"
        default: ""

permissions:
  contents: write

env:
  APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
  SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
  SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
  ROSE: ${{ github.event.inputs.task == 'rose' || github.event.schedule == '0 6 * * 4' }}
  LISTONE: ${{ github.event.inputs.task == 'listone' }}
  # live: nei giorni di partita ogni 30 minuti solo voti + risultati provvisori delle leghe (fix 010), senza pagine e senza commit
  LIVE: ${{ github.event.inputs.task == 'live' || github.event.schedule == '*/30 12-22 * * 5,6,0,1' || github.event.schedule == '*/30 17-22 * * 2,3,4' }}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Listone completo (prezzi e ruoli ricalcolati)
        if: ${{ env.LISTONE == 'true' }}
        run: python scripts/fanta_players.py --prezzi
      - name: Sincronizza rose (settimanale o task=rose)
        if: ${{ env.ROSE == 'true' }}
        run: python scripts/fanta_players.py
      - name: Voti
        if: ${{ env.LISTONE != 'true' && env.ROSE != 'true' }}
        run: python scripts/fanta_voti.py ${{ github.event.inputs.matchday }}
      - name: Indice titolarità
        if: ${{ env.LISTONE != 'true' && env.ROSE != 'true' && env.LIVE != 'true' }}
        run: python scripts/fanta_titolari.py || echo "titolari skip"
      - name: Probabili formazioni (ultime 3 formazioni ufficiali + titolarità, ~1-11 chiamate)
        if: ${{ env.LISTONE != 'true' && env.ROSE != 'true' && env.LIVE != 'true' }}
        run: python scripts/fanta_probabili.py || echo "probabili skip"
      # DOPO titolarità e probabili, non prima: i bot leggono data/fanta/probabili-NN.json, quindi messi in testa
      # userebbero SEMPRE le probabili del giro precedente - una perdita di qualità sistematica, a ogni run.
      # Il rischio opposto (i voti falliscono e il job muore prima di arrivare qui) è molto più raro e comunque
      # limitato: fra le schedule c'è più di un run al giorno e lo script agisce fino a 36 ore prima della deadline,
      # quindi ha diverse occasioni. Se i voti restano rotti per 36 ore, le formazioni dei bot non sono il problema.
      - name: Formazioni delle squadre bot (lega Fantamarcio 26/27, non sovrascrive mai una formazione già inviata)
        if: ${{ env.LISTONE != 'true' && env.ROSE != 'true' && env.LIVE != 'true' }}
        run: python scripts/fanta_bots.py || echo "bot formazioni skip"
      - name: Statistiche squadre e schede giocatore (data/stats, ~60-130 chiamate a regime)
        if: ${{ env.LIVE != 'true' }}
        run: python scripts/stats_pull.py || echo "stats_pull skip (restano i JSON precedenti)"
      - name: Pagine statiche (fantacalcio, squadre con statistiche, schede giocatore) e sitemap
        if: ${{ env.LIVE != 'true' }}
        run: python scripts/render_site.py || echo "render_site skip"
      - name: Commit dati
        if: ${{ env.LIVE != 'true' }}
        run: |
          git config user.name "TransferBeat Bot"
          git config user.email "bot@transferbeat.com"
          git add data/fanta data/stats fantacalcio squadre giocatori campionati data/lastmod.json llms.txt robots.txt sitemap.xml sitemap-*.xml index.html board.html campionati.html chi-siamo.html
          git diff --cached --quiet || git commit -m "FantaTB dati $(date -u +'%Y-%m-%d %H:%M UTC')"
          git pull --rebase origin main || true
          git push && python scripts/indexnow.py || echo "push fallito"
